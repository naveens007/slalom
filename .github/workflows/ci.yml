name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # Both compilers are built and run inside ONE job so they execute on the same
  # runner (same CPU, same cache, same load). A matrix would schedule gcc and
  # clang on different machines and make the MFLOPS numbers incomparable.
  build-and-run:
    name: build & run (gcc + clang, same runner)
    # Pinned instead of ubuntu-latest so the toolchain/image does not change
    # underneath us (ubuntu-latest migrates to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    env:
      # Identical benchmark parameters for both compilers.
      SLALOM_ARGS: "-t 10 -l 400 -u 4000"
      COMPILERS: "gcc clang"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Optional at build time, but gives the benchmark a richer machine report.
          sudo apt-get install -y libcpuinfo-dev

      - name: Build (all compilers)
        run: |
          for cc in $COMPILERS; do
            echo "::group::configure + build ($cc)"
            cmake -S . -B "build-$cc" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$cc" \
              -DSLALOM_SUN4_DDOT=ON
            cmake --build "build-$cc" -j "$(nproc)"
            cmake --install "build-$cc"
            echo "::endgroup::"
          done

      - name: Build (C++ implementation, opt-in)
        run: |
          echo "::group::configure + build (C++)"
          cmake -S . -B build-cxx \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSLALOM_SUN4_DDOT=ON \
            -DSLALOM_ENABLE_CXX=ON
          cmake --build build-cxx -j "$(nproc)"
          cmake --install build-cxx
          echo "::endgroup::"

      - name: Run benchmark (same runner, back to back)
        run: |
          for cc in $COMPILERS; do
            echo "::group::slalom ($cc)"
            ./build-$cc/install/bin/slalom $SLALOM_ARGS | tee "slalom-$cc.log"
            echo "::endgroup::"
          done
          echo "::group::slalom-cxx (C++ scaffold)"
          ./build-cxx/install/bin/slalom-cxx | tee "slalom-cxx.log"
          echo "::endgroup::"

      - name: Summarise
        run: |
          cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          {
            echo "### SLALOM results"
            echo
            echo "Runner: \`$cpu\`, $(nproc) vCPUs — gcc and clang measured on the same machine."
            echo
            echo "Arguments: \`$SLALOM_ARGS\` (Release, SUN4/unrolled DDot)"
            echo
            echo "| implementation | n | MFLOPS |"
            echo "|---|---:|---:|"
            for cc in $COMPILERS; do
              n=$(awk '/^n:/{print $2}' "slalom-$cc.log")
              m=$(awk '/^n:/{print $NF}' "slalom-$cc.log")
              echo "| $cc, C reference | $n | $m |"
            done
            echo "| g++, C++ scaffold | not ported yet | - |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: slalom-results
          path: slalom-*.log
